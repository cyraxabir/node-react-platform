apiVersion: v1
kind: PersistentVolume
metadata:
  name: node-react-redis-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-nfs
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.10.200.70
    path: /var/k8s-nfs/react/redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: redis-nfs
  volumeName: node-react-redis-pv
  resources:
    requests:
      storage: 1Gi
