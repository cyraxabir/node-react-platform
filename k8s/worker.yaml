apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: dev
  labels:
    app: queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      containers:
        - name: worker
          image: cyrax001/backend:latest
          imagePullPolicy: Always
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
